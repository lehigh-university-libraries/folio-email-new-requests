name: deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'environment to deploy to'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - prod
jobs:
  run:
    uses: lehigh-university-libraries/gha/.github/workflows/linderman-deploy.yaml@0ad0a7d96a7b3a5c05ad811832108d67e3dea92c # main
    with:
      url: https://apps-${{ inputs.environment }}.lib.lehigh.edu/_rollout
    permissions:
      contents: read
      id-token: write
  